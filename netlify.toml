# Netlify — Next.js App Router
[build]
  # db push يضيف الأعمدة/الجداول الجديدة لقاعدة البيانات قبل البناء.
  # بدون --accept-data-loss: لو فيه تغيير هيمسح بيانات، البناء يفشل بدل ما يمسح.
  # sync-content: ينشر المقالات ويحدّث النصوص الافتراضية للهجة الكويتية (الإنتاج فقط)
  command = "npx prisma db push --skip-generate && npx prisma generate && node scripts/sync-content.mjs && next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Prisma على بيئة Netlify (Linux)
  PRISMA_CLI_BINARY_TARGETS = "rhel-openssl-3.0.x,debian-openssl-3.0.x"
  NPM_FLAGS = "--include=dev"
  
[[plugins]]
  package = "@netlify/plugin-nextjs"

# لا تفهرس لوحة التحكم
[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/api/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# إعادة توجيه اختيارية لـ www (فعّلها بعد ربط الدومين)
# [[redirects]]
#   from = "https://yourdomain.com/*"
#   to = "https://www.yourdomain.com/:splat"
#   status = 301
#   force = true
